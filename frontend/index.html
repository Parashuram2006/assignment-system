<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joineazy — Academic Course, Group & Assignment Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
      }
      h1, h2, h3, .font-display {
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        letter-spacing: -0.02em;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      @keyframes checkPop {
        0% { transform: scale(0.5); opacity: 0; }
        65% { transform: scale(1.18); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes cardCompleteGlow {
        0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); border-color: #10b981; }
        70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); border-color: #34d399; }
        100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
      }
      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-check-pop {
        animation: checkPop 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-card-complete {
        animation: cardCompleteGlow 1.25s ease-out;
      }
      .animate-view-enter {
        animation: fadeSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
